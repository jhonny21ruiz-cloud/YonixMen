<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YonixMen</title>

    <link rel="stylesheet" href="css/estilos.css?v=16">

</head>


<body>


<div class="contenedor">



    <!-- PARTE IZQUIERDA -->


    <div class="izquierda">


        <h2>
            BIENVENIDO!!!
        </h2>



        <div class="imagen">


            <img 
            id="imagenCambio"
            src="img/YONIX.png"
            alt="Logo Yonix Men">


        </div>





        <h1>

            PRESUME TUS AUTOS FAVORITOS...

        </h1>





        <p>

            Enseña tus autos favoritos y modelos exclusivos.

        </p>




    </div>







    <!-- LOGIN -->


    <div class="login">



        <h3 class="tituloLogin">

            INICIAR SESIÓN

        </h3>





        <input 
        type="text"
        placeholder="Correo electrónico o teléfono">





        <input 
        type="password"
        placeholder="Contraseña">







        <button 
        class="entrar"
        onclick="location.href='inicio.html'">

            Iniciar sesión

        </button>







        <a href="#">

            ¿Olvidaste tu contraseña?

        </a>






        <hr>







        <button class="crear">

            Crear cuenta nueva

        </button>






    </div>





</div>







<script src="js/funciones.js?v=16"></script>



</body>

</html>
